[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inwime"
dynamic = ["version"]
description = "Out-of-core local inference of large language models from original BF16 checkpoints, with bounded memory."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub==2.4.0",
    "httpx2==2.16.2",            # imported directly by the catalog for network errors
    "starlette==1.10.0",         # `inwime serve` HTTP API
    "uvicorn==0.54.0",
    "tokenizers==0.23.3",        # tokenizer.json of the Checkpoint, without Transformers or torch
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
]

[project.scripts]
inwime = "inwime.cli:main"

[tool.setuptools]
packages = ["inwime", "inwime_runtime"]

[tool.setuptools.dynamic]
version = { attr = "inwime.__version__" }
